<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- This site has moved. GitHub Pages serves files and nothing else -- no server-side redirect, no
     .htaccess -- so a visitor is sent on by the page itself: the meta refresh for a browser with no
     JavaScript, location.replace for one with it (which leaves no entry in the back history), and the
     canonical link for a search engine. Anything under a path of its own, such as /calc/, is untouched. -->
<meta http-equiv="refresh" content="0; url=https://www.zousoft.com/">
<link rel="canonical" href="https://www.zousoft.com/">
<title>zousoft.com</title>
<script>location.replace('https://www.zousoft.com/' + location.search + location.hash);</script>
</head>
<body style="font:15px system-ui; padding:2em">
<p>This page has moved to <a href="https://www.zousoft.com/">www.zousoft.com</a>.</p>
</body>
</html>
